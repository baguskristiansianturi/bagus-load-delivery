name: Deploy to GitHub Pages
# Pull requests validate and upload an artifact; the dedicated UI-test branch deploys
# to the same Pages site so the owner can inspect the real mobile UI before merge.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/circle-feed-navigation-mobile-white
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pluits-pages-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production surface and backend contracts
        run: npm test

      - name: Build Vite production
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/circle-feed-navigation-mobile-white')
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
