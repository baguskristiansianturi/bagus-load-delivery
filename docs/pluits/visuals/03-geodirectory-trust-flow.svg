<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780"><rect width="1500" height="780" fill="#f7f9fc"/><text x="750" y="65" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#172b45">GeoDirectory — Place, Claim, Verification & Local Trust</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="190" width="250" height="150" rx="20" fill="#fff" stroke="#d6e0eb" stroke-width="2"/><text x="195" y="240" font-size="23" font-weight="700" fill="#172b45">PLACE PIN</text><text x="195" y="280" font-size="17" fill="#617186">Source + location</text><text x="195" y="310" font-size="17" fill="#617186">Unclaimed / listed</text><rect x="420" y="190" width="250" height="150" rx="20" fill="#fff" stroke="#d6e0eb" stroke-width="2"/><text x="545" y="240" font-size="23" font-weight="700" fill="#172b45">CLAIM</text><text x="545" y="280" font-size="17" fill="#617186">Applicant + authority</text><text x="545" y="310" font-size="17" fill="#617186">Evidence submitted</text><rect x="770" y="190" width="250" height="150" rx="20" fill="#fff" stroke="#d6e0eb" stroke-width="2"/><text x="895" y="240" font-size="23" font-weight="700" fill="#172b45">REVIEW</text><text x="895" y="280" font-size="17" fill="#617186">Human verification</text><text x="895" y="310" font-size="17" fill="#617186">Duplicate / dispute check</text><rect x="1120" y="190" width="300" height="150" rx="20" fill="#eaf0f7" stroke="#b9c9db" stroke-width="2"/><text x="1270" y="240" font-size="23" font-weight="700" fill="#172b45">MANAGED ENTITY</text><text x="1270" y="280" font-size="17" fill="#617186">Role + permission</text><text x="1270" y="310" font-size="17" fill="#617186">Audit + renewal</text></g><g stroke="#8da1b8" stroke-width="4" fill="none"><path d="M325 265 H410"/><path d="M675 265 H760"/><path d="M1025 265 H1110"/></g><g fill="#172b45"><path d="M405 255 L420 265 L405 275 Z"/><path d="M755 255 L770 265 L755 275 Z"/><path d="M1105 255 L1120 265 L1105 275