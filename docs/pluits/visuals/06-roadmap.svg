<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650"><rect width="1500" height="650" fill="#f7f9fc"/><text x="750" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#172b45">PLUITS — Bali-first Delivery Roadmap</text><g font-family="Arial"><g fill="#fff" stroke="#d7e0eb" stroke-width="2"><rect x="65" y="145" width="250" height="170" rx="20"/><rect x="335" y="145" width="250" height="170" rx="20"/><rect x="605" y="145" width="250" height="170" rx="20"/><rect x="875" y="145" width="250" height="170" rx="20"/><rect x="1145" y="145" width="290" height="170" rx="20"/></g><g fill="#172b45" font-size="22" font-weight="700" text-anchor="middle"><text x="190" y="195">P0 · SOCIAL</text><text x="460" y="195">P1 · GEO</text><text x="730" y="195">P2 · IDENTITY</text><text x="1000" y="195">P3 · BUSINESS</text><text x="1290" y="195">P4 · TRIP</text></g><g fill="#627184" font-size="16" text-anchor="middle"><text x="190" y="235">UAT & release gate</text><text x="190" y="265">2–6 weeks*</text><text x="460" y="235">Claims · data · trust</text><text x="460" y="265">4–8 weeks*</text><text x="730" y="235">Professional · org</text><text x="730" y="265">4–8 weeks*</text><text x="1000" y="235">Catalog · order · tools</text><text x="1000" y="265">6–10 weeks*</text><text x="1290" y="235">Booking · experience</text><text x="1290" y="265">6–10 weeks*</text></g></g><g stroke="#8da1b8" stroke-width="4" fill="none"><path d="M315 230 H330"/><path d="M585 230 H600"/><path d="M855 230 H870"/><path d="M1125 230 H1140"/></g><rect x="180" y="390" width="540" height="145" rx="20" fill="#eaf0f7" stroke="#c8d5e5" stroke-width="2"/><rect x="780" y="390" width="540" height="145" rx="20" fill="#eaf0f7" stroke="#c8d5e5" stroke-width="2"/><g font-family="Arial" text-anchor="middle"><text x="450" y="440" font-size="23" font-weight="700" fill="#172b45">P5 · FINANCE & CREATOR</text><text x="450" y="480" font-size="17" fill="#627184">Wallet ledger · affiliate · donation readiness</text><text x="450" y="510" font-size="16" fill="#627184">8–16+ weeks, after legal/security gate</text><text x="1050" y="440" font-size="23" font-weight="700" fill="#172b45">P6–P8 · COMMUNITY & EXPANSION</text><text x="1050" y="480" font-size="17" fill="#627184">Hiring · public services · regional operations</text><text x="1050" y="510" font-size="16" fill="#627184">12–18+ months, readiness-based</text></g><text x="750" y="600" text-anchor="middle" font-family="Arial" font-size="15" fill="#627184">*Indicative planning ranges for a small cross-functional team, not a committed schedule.</text></svg>