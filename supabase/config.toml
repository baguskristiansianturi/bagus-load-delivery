# Local-only Supabase configuration for CI and developer workstations.
# This project_id is deliberately NOT a hosted Supabase project reference.
project_id = "pluits-local-ci"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
admin_email = "admin@pluits.local"
sender_name = "Pluits Local Test"

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
